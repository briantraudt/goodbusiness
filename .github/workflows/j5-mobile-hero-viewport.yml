name: Apply J5 mobile hero viewport

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/j5-mobile-hero-viewport.yml

permissions:
  contents: write

jobs:
  update-j5-mobile-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine mobile hero
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('public/j5/index.html')
          html = index_path.read_text()

          replacements = {
              '<a class="btn" href="#dinner">View Dinner Menu <span>→</span></a>':
              '<a class="btn" href="#dinner">View Menu <span>→</span></a>',
              '<a class="btn secondary" href="https://www.google.com/maps/search/?api=1&amp;query=21814+Hwy+71+W+Spicewood+TX+78669" target="_blank" rel="noopener">Get Directions <span>↗</span></a>':
              '<a class="btn secondary" href="#hours">Hours &amp; Location <span>↓</span></a>',
              '<section class="intro-strip">':
              '<section class="intro-strip" id="hours">',
          }

          for old, new in replacements.items():
              if old in html:
                  html = html.replace(old, new, 1)
              elif new not in html:
                  raise SystemExit(f'Expected J5 markup was not found: {old}')

          index_path.write_text(html)

          css_path = Path('public/j5/mobile.css')
          css = css_path.read_text()
          marker = '/* J5 mobile hero viewport pass */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + '\n\n'

          css += r'''/* J5 mobile hero viewport pass */
@media(max-width:820px){
  html{scroll-padding-top:68px}
  .nav{height:68px}
  .nav-inner{width:calc(100% - 24px);gap:12px}
  .brand-j5{font-size:2.35rem}
  .brand-rule{height:30px}
  .brand-copy b{font-size:.59rem;letter-spacing:.16em}
  .brand-copy em{font-size:.76rem}
  .menu-toggle{width:40px;height:40px;flex:0 0 40px}
  .mobile-menu{top:68px}

  .hero{
    height:100svh;
    height:100dvh;
    min-height:620px;
    align-items:stretch;
    background-position:center 58%;
    background-size:cover;
    background-image:
      linear-gradient(180deg,rgba(9,7,5,.54) 0%,rgba(9,7,5,.2) 30%,rgba(9,7,5,.28) 62%,rgba(9,7,5,.9) 100%),
      linear-gradient(90deg,rgba(9,7,5,.34) 0%,rgba(9,7,5,.06) 55%,rgba(9,7,5,.24) 100%),
      url("https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1400&q=86");
  }
  .hero::after{background:linear-gradient(180deg,rgba(0,0,0,.05),transparent 48%,rgba(0,0,0,.36))}
  .hero-content,
  .hero-content.wrap{
    width:100%;
    max-width:none;
    height:100%;
    min-height:100%;
    margin:0;
    padding:82px 18px 16px;
    display:block;
  }
  .hero-copy{
    width:100%;
    max-width:none;
    height:100%;
    min-height:0;
    display:grid;
    grid-template-rows:minmax(18px,1fr) auto auto auto minmax(18px,1fr) auto;
    align-items:center;
    text-align:center;
  }
  .hero-kicker{
    grid-row:2;
    justify-self:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    font-size:.56rem;
    letter-spacing:.17em;
  }
  .hero-kicker i{width:24px}
  .hero h1{
    grid-row:3;
    justify-self:center;
    max-width:100%;
    margin:12px 0 14px;
    font-size:clamp(3rem,10.5vw,4.2rem);
    line-height:.88;
    letter-spacing:-.055em;
    text-align:center;
  }
  .hero h1 span,
  .hero h1 em{white-space:nowrap}
  .hero p{
    grid-row:4;
    justify-self:center;
    max-width:30rem;
    margin:0;
    font-size:.96rem;
    line-height:1.48;
    text-align:center;
  }
  .hero-actions{
    grid-row:6;
    align-self:end;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    width:100%;
    margin:0;
  }
  .hero .btn{
    width:100%;
    min-height:54px;
    padding:0 12px;
    font-size:.64rem;
    letter-spacing:.12em;
    white-space:nowrap;
  }
  .hero-support{display:none!important}
  .walkin{display:none!important}
}

@media(max-width:480px){
  .hero{min-height:580px;background-position:center 56%}
  .hero-content,
  .hero-content.wrap{padding:78px 14px 14px}
  .hero-copy{grid-template-rows:minmax(12px,1fr) auto auto auto minmax(12px,1fr) auto}
  .hero-kicker{font-size:.51rem;letter-spacing:.14em;gap:7px}
  .hero-kicker i{width:18px}
  .hero h1{font-size:clamp(2.65rem,12vw,3.4rem);line-height:.89;margin:10px 0 12px}
  .hero p{max-width:25rem;font-size:.89rem;line-height:1.44}
  .hero-actions{gap:8px}
  .hero .btn{min-height:50px;padding:0 9px;font-size:.59rem;letter-spacing:.1em}
}

@media(max-width:360px){
  .hero h1{font-size:2.55rem}
  .hero p{font-size:.85rem}
  .hero .btn{font-size:.56rem;letter-spacing:.08em}
}

@media(max-width:820px) and (max-height:660px){
  .hero-content,
  .hero-content.wrap{padding-top:74px;padding-bottom:12px}
  .hero h1{font-size:clamp(2.65rem,9.5vw,3.55rem);margin:8px 0 10px}
  .hero p{font-size:.86rem;line-height:1.38}
  .hero .btn{min-height:48px}
}
'''
          css_path.write_text(css)
          PY

      - name: Commit directly to main
        run: |
          rm .github/workflows/j5-mobile-hero-viewport.yml
          git config user.name "Good Business Automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/j5/index.html public/j5/mobile.css .github/workflows/j5-mobile-hero-viewport.yml
          git commit -m "Refine J5 mobile hero layout"
          git push origin main
