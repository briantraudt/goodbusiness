name: Optimize J5 mobile UX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/j5-mobile-ux.yml

permissions:
  contents: write

jobs:
  optimize-j5-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable the mobile stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('public/j5/index.html')
          text = path.read_text()
          link = '  <link rel="stylesheet" href="/j5/mobile.css?v=20260918-1" />\n'

          if link not in text:
              if '</head>' not in text:
                  raise SystemExit('Could not find closing head tag')
              text = text.replace('</head>', link + '</head>', 1)

          text = re.sub(
              r'<img(?![^>]*\bloading=)([^>]*)>',
              r'<img loading="lazy" decoding="async"\1>',
              text,
          )
          path.write_text(text)
          PY

      - name: Commit mobile optimization to main
        run: |
          rm .github/workflows/j5-mobile-ux.yml
          git config user.name "Good Business Automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/j5/index.html .github/workflows/j5-mobile-ux.yml
          git commit -m "Optimize J5 website for mobile"
          git push origin main
