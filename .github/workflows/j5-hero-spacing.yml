name: Apply J5 hero spacing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/j5-hero-spacing.yml

permissions:
  contents: write

jobs:
  update-j5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move hero content away from viewport edge
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/j5/index.html')
          text = path.read_text()

          replacements = {
              '.hero-content{position:relative;z-index:2;padding:126px 0 48px;display:grid;grid-template-columns:minmax(0,840px) minmax(260px,310px);gap:clamp(48px,7vw,116px);align-items:end;width:100%}':
              '.hero-content{position:relative;z-index:2;padding:126px clamp(28px,3vw,56px) 48px clamp(56px,6vw,112px);display:grid;grid-template-columns:minmax(0,840px) minmax(260px,310px);gap:clamp(48px,7vw,116px);align-items:end;width:100%}',
              '.hero-content{grid-template-columns:1fr;gap:30px;padding:140px 0 66px}':
              '.hero-content{grid-template-columns:1fr;gap:30px;padding:140px clamp(28px,4vw,48px) 66px}',
              '.hero-content{padding:126px 0 54px}':
              '.hero-content{padding:126px 18px 54px}',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected CSS rule not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit directly to main
        run: |
          rm .github/workflows/j5-hero-spacing.yml
          git config user.name "Good Business Automation"
          git config user.email "actions@users.noreply.github.com"
          git add public/j5/index.html .github/workflows/j5-hero-spacing.yml
          git commit -m "Move J5 hero content away from left edge"
          git push origin main
