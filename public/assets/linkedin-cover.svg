  <desc id="desc">A Good Business LinkedIn cover image with a cream grid background and the phrase We build what the future will use.</desc>
  <defs>
    <linearGradient id="warmGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0"/>
